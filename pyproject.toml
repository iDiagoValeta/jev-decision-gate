[project]
name = "jev-decision-gate"
version = "0.3.0"
description = "Jev (TypeSafe AI) as the permission gate for OpenCode"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jev-decision-gate contributors" }]
requires-python = ">=3.10"
dependencies = ["typesafe-sdk"]
keywords = ["opencode", "permissions", "ai-safety", "typesafe", "jev"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "bandit"]
test = ["pytest"]

[project.scripts]
jev-gate-doctor = "jev_gate.doctor:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Intentional set: pyflakes + pycodice-errors only. Blind `except` and
# `try/except/pass` are the fail-open design, not lint debt (see
# SECURITY.md), so flake8-blind-except / bandit rules stay off.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["jev_gate"]
